name: Export and publish slide decks

on:
  push:
    branches: [main]
    paths:
      - "week-*/slides.md"
      - "week-*/demo/**"
      - "week-*/homework-checks.js"
      - ".github/workflows/export-slides.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export every deck to HTML
        run: |
          for f in week-*/slides.md; do
            npx -y @marp-team/marp-cli "$f" -o "${f%.md}.html"
          done

      # The lab slide's "⏱️ NN minutes" becomes a live countdown with a Start
      # button. Marp turns the ⏱️ into a twemoji <img>, so the script keys off
      # that image and the duration text after it — nothing to author per week,
      # and a deck with no lab slide is left alone.
      - name: Add the lab countdown to each deck
        run: |
          node -e '
            const fs = require("fs");
            const js = fs.readFileSync("scripts/lab-timer.js", "utf8");
            let n = 0;
            for (const f of process.argv.slice(1)) {
              let h = fs.readFileSync(f, "utf8");
              if (h.includes("data-lab-timer")) continue;
              if (!h.includes("</body>")) { console.log("no </body>: " + f); continue; }
              fs.writeFileSync(f, h.replace("</body>", "<script data-lab-timer>" + js + "</script></body>"));
              n++;
            }
            console.log("lab timer injected into " + n + " deck(s)");
          ' week-*/slides.html

      - name: Commit regenerated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-*/slides.html
          git diff --cached --quiet || git commit -m "Regenerate slide decks [skip ci]"
          git push

      # Pages site hosts decks, demo pages, and the instructor demo-script checklists —
      # all public-repo material. NEVER answer-key content (solutions, graders).
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          STYLE='body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3;line-height:1.6}a{color:#79c0ff}code{background:#151b23;padding:.1rem .35rem;border-radius:4px}pre{background:#151b23;padding:.8rem;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}li{margin:.35rem 0}input[type=checkbox]{transform:scale(1.3);margin-right:.5rem}li:has(input:checked){opacity:.45;text-decoration:line-through}li.task{cursor:pointer}li.task a,li.task pre,li.task button{cursor:auto}li.task a{cursor:pointer}li>p{display:inline;margin:0}button{padding:.3rem .9rem}blockquote{border-left:3px solid #79c0ff;margin-left:0;padding-left:1rem;color:#a5b4c4}details{margin:.5rem 0}pre{position:relative}pre button.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .5rem;font-size:.72rem;line-height:1.4;background:#243040;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;cursor:pointer;opacity:.55}pre button.copy:hover,pre:hover button.copy{opacity:1}#portbar{position:sticky;top:0;z-index:5;display:block;background:#1c2733;padding:.5rem 0;margin-bottom:.6rem;border-bottom:1px solid #3a4a5e}#portbar input{width:5.5rem;background:#151b23;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;padding:.25rem .4rem;font:inherit}#portbar small{color:#a5b4c4;margin-left:.5rem}blockquote.alert{border-left:4px solid var(--c);background:#151b23;color:#e6edf3;padding:.7rem 1rem;border-radius:0 6px 6px 0;margin:1rem 0}blockquote.alert>p:first-of-type::before{display:block;color:var(--c);font-weight:600;letter-spacing:.02em;margin-bottom:.2rem}blockquote.alert>*:last-child{margin-bottom:0}blockquote.alert.note{--c:#4493f8}blockquote.alert.note>p:first-of-type::before{content:"ℹ️ Note"}blockquote.alert.tip{--c:#3fb950}blockquote.alert.tip>p:first-of-type::before{content:"💡 Tip"}blockquote.alert.important{--c:#ab7df8}blockquote.alert.important>p:first-of-type::before{content:"❗ Important"}blockquote.alert.warning{--c:#d29922}blockquote.alert.warning>p:first-of-type::before{content:"⚠️ Warning"}blockquote.alert.caution{--c:#f85149}blockquote.alert.caution>p:first-of-type::before{content:"🛑 Caution"}'
          checklist () { # $1 md  $2 out  $3 storage-prefix  $4 title
            {
              echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
              echo "<title>$4</title><style>$STYLE</style>"
              echo "</head><body><button onclick=\"Object.keys(localStorage).filter(k=>k.startsWith('$3')).forEach(k=>localStorage.removeItem(k));location.reload()\">Reset checkboxes</button>"
              # marked has no GitHub-alert extension, so `> [!TIP]` survives as literal
              # text in a plain blockquote. Tag the blockquote and let CSS draw the
              # heading — the sheets lean on these to mark the restore steps.
              sed "s|](\.\./|](https://github.com/jgrissom/dotnet-web-dev/blob/main/$wk/|g" "$1" | npx -y marked --gfm \
                | perl -0pe 's{<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*}{<blockquote class="alert \L$1\E"><p>}g'
              echo "<script>document.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;const k='$3-'+i;cb.checked=localStorage.getItem(k)==='1';cb.addEventListener('change',()=>localStorage.setItem(k,cb.checked?'1':'0'));});</script>"
              # The whole line toggles its box — the sheet is read off a tablet mid-demo
              # and the box alone is a poor target. Anything interactive inside the line
              # must NOT toggle: links, Copy buttons, code blocks, and <details> (whose
              # triangle is a widget, not text). Nor should finishing a text selection.
              echo "<script>document.querySelectorAll('li').forEach(function(li){var cb=li.querySelector(':scope > input[type=checkbox], :scope > p > input[type=checkbox]');if(!cb)return;li.classList.add('task');li.addEventListener('click',function(e){if(e.target===cb)return;if(e.target.closest('a,button,pre,details'))return;if(e.target.closest('li')!==li)return;if((getSelection()+'').length)return;cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));});});</script>"
              # Copy button on every code block — you're grabbing these mid-demo.
              echo "<script>document.querySelectorAll('pre').forEach(function(pre){var b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copy';b.addEventListener('click',function(){var c=pre.querySelector('code');var t=(c||pre).innerText;navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1200);},function(){var r=document.createRange();r.selectNodeContents(c||pre);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Press Cmd/Ctrl+C';setTimeout(function(){b.textContent='Copy';},2000);});});pre.appendChild(b);});</script>"
              # Port box: the demo app's port varies by machine, and a wrong port in a
              # pasted curl fails mid-demo. Retype it once here and every localhost URL
              # in the page follows — including what the Copy buttons put on the clipboard.
              echo "<script>(function(){var K='$3-port';var RE=/localhost:[0-9]+/;var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var nodes=[],n;while(n=w.nextNode()){if(RE.test(n.nodeValue)&&n.parentElement&&n.parentElement.closest('pre,code'))nodes.push(n);}if(!nodes.length)return;var m=nodes[0].nodeValue.match(/localhost:([0-9]+)/);var def=m?m[1]:'5000';function apply(p){nodes.forEach(function(t){t.nodeValue=t.nodeValue.replace(/localhost:[0-9]+/g,'localhost:'+p);});}var bar=document.createElement('span');bar.id='portbar';var lab=document.createElement('label');lab.textContent='Port ';var box=document.createElement('input');box.type='number';box.min='1';box.max='65535';lab.appendChild(box);var hint=document.createElement('small');hint.textContent='every localhost URL below follows this box';bar.appendChild(lab);bar.appendChild(hint);document.body.insertBefore(bar,document.body.firstChild);box.value=localStorage.getItem(K)||def;apply(box.value);box.addEventListener('input',function(){var v=box.value.trim();if(!/^[0-9]{2,5}\$/.test(v))return;localStorage.setItem(K,v);apply(v);});})();</script></body></html>"
            } > "$2"
          }
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>.NET Web Dev — Slide Decks</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3}a{color:#79c0ff;text-decoration:none;font-size:1.2rem}li{margin:.6rem 0}h1{font-size:1.5rem}</style>'
            echo '</head><body><h1>.NET Web Development — Slide Decks</h1><ul>'
            for f in week-*/slides.md; do
              wk="${f%/slides.md}"
              mkdir -p "_site/$wk"
              cp "${f%.md}.html" "_site/$wk/index.html"
              extra=""
              if [ -f "$wk/demo/finished.html" ]; then
                mkdir -p "_site/$wk/demo"
                cp "$wk/demo/finished.html" "_site/$wk/demo/index.html"
                extra=" · <a href=\"$wk/demo/\">demo</a>"
                if [ -f "$wk/demo/index.html" ]; then
                  cp "$wk/demo/index.html" "_site/$wk/demo/before.html"
                  extra="$extra · <a href=\"$wk/demo/before.html\">before</a>"
                fi
              fi
              if [ -f "$wk/demo/demo-script.md" ]; then
                mkdir -p "_site/$wk/demo"
                checklist "$wk/demo/demo-script.md" "_site/$wk/demo/script.html" "$wk-step" "$wk demo script"
                extra="$extra · <a href=\"$wk/demo/script.html\">script</a>"
              fi
              # Student self-check: served so students load it with a one-line
              # fetch+eval from their OWN site's console (Pages sends CORS *).
              if [ -f "$wk/homework-checks.js" ]; then
                cp "$wk/homework-checks.js" "_site/$wk/homework-checks.js"
                extra="$extra · <a href=\"$wk/homework-checks.js\">checker</a>"
              fi
              echo "<li><a href=\"$wk/\">${wk/week-0/Week }</a>$extra</li>"
            done
            echo '</ul><p>Navigate decks with arrow keys · F for fullscreen</p></body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
