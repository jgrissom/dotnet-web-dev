name: Export and publish slide decks

on:
  push:
    branches: [main]
    paths:
      - "week-*/slides.md"
      - "week-*/demo/**"
      - ".github/workflows/export-slides.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export every deck to HTML
        run: |
          for f in week-*/slides.md; do
            npx -y @marp-team/marp-cli "$f" -o "${f%.md}.html"
          done

      - name: Commit regenerated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-*/slides.html
          git diff --cached --quiet || git commit -m "Regenerate slide decks [skip ci]"
          git push

      # Pages site contains ONLY decks + finished demo pages + an index — never labs, solutions, or notes.
      - name: Assemble Pages site (slides + demos)
        run: |
          mkdir -p _site
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>.NET Web Dev — Slide Decks</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3}a{color:#79c0ff;text-decoration:none;font-size:1.2rem}li{margin:.6rem 0}h1{font-size:1.5rem}</style>'
            echo '</head><body><h1>.NET Web Development — Slide Decks</h1><ul>'
            for f in week-*/slides.md; do
              wk="${f%/slides.md}"
              mkdir -p "_site/$wk"
              cp "${f%.md}.html" "_site/$wk/index.html"
              extra=""
              if [ -f "$wk/demo/finished.html" ]; then
                mkdir -p "_site/$wk/demo"
                cp "$wk/demo/finished.html" "_site/$wk/demo/index.html"
                extra=" · <a href=\"$wk/demo/\">demo</a>"
                if [ -f "$wk/demo/index.html" ]; then
                  cp "$wk/demo/index.html" "_site/$wk/demo/before.html"
                  extra="$extra · <a href=\"$wk/demo/before.html\">before</a>"
                fi
                if [ -f "$wk/demo/demo-script.md" ]; then
                  {
                    echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
                    echo "<title>$wk demo script</title>"
                    echo '<style>body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3;line-height:1.6}a{color:#79c0ff}code{background:#151b23;padding:.1rem .35rem;border-radius:4px}pre{background:#151b23;padding:.8rem;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}li{margin:.35rem 0}input[type=checkbox]{transform:scale(1.3);margin-right:.5rem}li:has(> input:checked){opacity:.45;text-decoration:line-through}button{padding:.3rem .9rem}blockquote{border-left:3px solid #79c0ff;margin-left:0;padding-left:1rem;color:#a5b4c4}</style>'
                    echo '</head><body><button onclick="localStorage.clear();location.reload()">Reset checkboxes</button>'
                    npx -y marked --gfm "$wk/demo/demo-script.md"
                    echo "<script>document.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;const k='$wk-step-'+i;cb.checked=localStorage.getItem(k)==='1';cb.addEventListener('change',()=>localStorage.setItem(k,cb.checked?'1':'0'));});</script></body></html>"
                  } > "_site/$wk/demo/script.html"
                  extra="$extra · <a href=\"$wk/demo/script.html\">script</a>"
                fi
              fi
              echo "<li><a href=\"$wk/\">${wk/week-0/Week }</a>$extra</li>"
            done
            echo '</ul><p>Navigate decks with arrow keys · F for fullscreen</p></body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
