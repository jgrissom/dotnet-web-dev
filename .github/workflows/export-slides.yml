name: Export and publish slide decks

on:
  push:
    branches: [main]
    paths:
      - "week-*/slides.md"
      - "week-*/demo/**"
      - "week-*/homework-checks.js"
      # scripts/ holds build inputs — lab-timer.js is injected into every deck,
      # render-cue-html.js renders every cue sheet. Editing one and pushing used
      # to publish NOTHING until the next day's cron, with nothing on screen to
      # say so. Deliberately the whole directory rather than a list of the files
      # in use: a hand-maintained list is true by maintenance, not construction,
      # and forgetting to extend it brings the silent staleness straight back.
      # The export is deterministic, so a run triggered by check-links.js and
      # friends commits nothing and just redeploys identical content.
      - "scripts/**"
      - ".github/workflows/export-slides.yml"
  # ⚠️ The step pages are built from the demo/week-NN BRANCHES, and a push to
  # one of those does not match `branches: [main]` above — so editing a step,
  # or a step's title, republishes NOTHING and nothing says so. Two ways out,
  # both already here: the daily cron picks it up within a day, and
  #   gh workflow run export-slides.yml --repo jgrissom/dotnet-web-dev
  # rebuilds on demand. Found the hard way: retitled all 22 steps, pushed the
  # branch, and the published page kept the old titles. An empty commit on main
  # does NOT help — it touches none of the paths above.
  # Safety net. On 2026-08-02 GitHub recorded a push to main and simply never
  # created a run for it, so the decks and the Pages site sat stale until the
  # workflow was dispatched by hand — and nothing announces that: the symptom
  # is a hosted cue sheet or self-check quietly serving last week's file.
  # (Not a path-filter bug; three earlier workflow-file-only pushes each
  # triggered correctly. It was a one-off dropped event.)
  # A daily re-render republishes within a day if an event is ever lost again.
  # This is only affordable because the export is now deterministic — before
  # the scoped-token fix below, every run committed, so a daily run would have
  # meant a commit a day of pure noise. Off-the-hour: scheduled jobs queued at
  # :00 get badly delayed.
  schedule:
    - cron: "23 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 because the step pages are rendered FROM git history —
      # scripts/render-demo-steps.js reads the per-beat commits off the
      # demo/week-NN branches and their w<NN>-step-* tags. A shallow checkout
      # has neither, and the symptom is a silently missing page rather than an
      # error, so the depth is load-bearing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export every deck to HTML
        run: |
          for f in week-*/slides.md; do
            npx -y @marp-team/marp-cli "$f" -o "${f%.md}.html"
          done

      # Marpit keys a `<style scoped>` block to a RANDOM token, regenerated on
      # every render — so a deck containing one (week 6's GET vs POST table is
      # the only one) differs from ITSELF run to run, and the commit step below
      # fired on every single run whether or not a slide had changed. That was
      # 80-odd "Regenerate slide decks" commits of pure noise, and a push race
      # for anyone who pushed and then pushed again.
      #
      # Rewrite each distinct token to a stable name, numbered per file in order
      # of first appearance. Numbering (rather than one fixed string) keeps two
      # scoped styles in the same deck distinct, which a blanket replace would
      # merge. The token is only a selector name; renaming it in the CSS and on
      # the <section> together leaves the deck byte-identical in every way that
      # renders.
      - name: Stabilise scoped-style tokens
        run: |
          node -e '
            const fs = require("fs");
            for (const f of process.argv.slice(1)) {
              const src = fs.readFileSync(f, "utf8");
              const seen = new Map();
              const out = src.replace(/data-marpit-scope-[A-Za-z0-9]+/g, (m) => {
                if (!seen.has(m)) seen.set(m, `data-marpit-scope-s${seen.size}`);
                return seen.get(m);
              });
              if (out !== src) fs.writeFileSync(f, out);
            }
          ' week-*/slides.html

      # The lab slide's "⏱️ NN minutes" becomes a live countdown with a Start
      # button. Marp turns the ⏱️ into a twemoji <img>, so the script keys off
      # that image and the duration text after it — nothing to author per week,
      # and a deck with no lab slide is left alone.
      - name: Add the lab countdown to each deck
        run: |
          node -e '
            const fs = require("fs");
            const js = fs.readFileSync("scripts/lab-timer.js", "utf8");
            let n = 0;
            for (const f of process.argv.slice(1)) {
              let h = fs.readFileSync(f, "utf8");
              if (h.includes("data-lab-timer")) continue;
              if (!h.includes("</body>")) { console.log("no </body>: " + f); continue; }
              fs.writeFileSync(f, h.replace("</body>", "<script data-lab-timer>" + js + "</script></body>"));
              n++;
            }
            console.log("lab timer injected into " + n + " deck(s)");
          ' week-*/slides.html

      - name: Commit regenerated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-*/slides.html
          git diff --cached --quiet || git commit -m "Regenerate slide decks [skip ci]"
          git push

      # Syntax highlighting for the cue sheets happens HERE, at build time, so the
      # published page carries the <span>s already and needs no CDN or runtime JS.
      # The sheet is read live at the projector on classroom wifi; a second origin
      # that can fail on its own is exactly what it does not need. Installed to a
      # temp prefix because the repo deliberately has no package.json.
      - name: Cue-sheet renderer deps
        run: npm i --no-save --silent --prefix "$RUNNER_TEMP/cuedeps" marked marked-highlight highlight.js

      # Pages site hosts decks, demo pages, and the instructor demo-script checklists —
      # all public-repo material. NEVER answer-key content (solutions, graders).
      - name: Assemble Pages site
        env:
          NODE_PATH: ${{ runner.temp }}/cuedeps/node_modules
        run: |
          mkdir -p _site
          STYLE='body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3;line-height:1.6}a{color:#79c0ff}code{background:#151b23;padding:.1rem .35rem;border-radius:4px}pre{background:#151b23;padding:.8rem;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}li{margin:.35rem 0}input[type=checkbox]{transform:scale(1.3);margin-right:.5rem}li:has(input:checked){opacity:.45;text-decoration:line-through}li.task{cursor:pointer}li.task a,li.task pre,li.task button{cursor:auto}li.task a{cursor:pointer}li>p{display:inline;margin:0}button{padding:.3rem .9rem}blockquote{border-left:3px solid #79c0ff;margin-left:0;padding-left:1rem;color:#a5b4c4}details{margin:.5rem 0}pre{position:relative}pre button.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .5rem;font-size:.72rem;line-height:1.4;background:#243040;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;cursor:pointer;opacity:.55}pre button.copy:hover,pre:hover button.copy{opacity:1}#portbar{position:sticky;top:0;z-index:5;display:block;background:#1c2733;padding:.5rem 0;margin-bottom:.6rem;border-bottom:1px solid #3a4a5e}#portbar input{width:5.5rem;background:#151b23;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;padding:.25rem .4rem;font:inherit}#portbar small{color:#a5b4c4;margin-left:.5rem}blockquote.alert{border-left:4px solid var(--c);background:#151b23;color:#e6edf3;padding:.7rem 1rem;border-radius:0 6px 6px 0;margin:1rem 0}blockquote.alert>p:first-of-type::before{display:block;color:var(--c);font-weight:600;letter-spacing:.02em;margin-bottom:.2rem}blockquote.alert>*:last-child{margin-bottom:0}blockquote.alert.note{--c:#4493f8}blockquote.alert.note>p:first-of-type::before{content:"ℹ️ Note"}blockquote.alert.tip{--c:#3fb950}blockquote.alert.tip>p:first-of-type::before{content:"💡 Tip"}blockquote.alert.important{--c:#ab7df8}blockquote.alert.important>p:first-of-type::before{content:"❗ Important"}blockquote.alert.warning{--c:#d29922}blockquote.alert.warning>p:first-of-type::before{content:"⚠️ Warning"}blockquote.alert.caution{--c:#f85149}blockquote.alert.caution>p:first-of-type::before{content:"🛑 Caution"}em.say{font-style:normal;color:#ffcf6b;background:rgba(255,207,107,.07);border-radius:3px;padding:0 .15rem;box-decoration-break:clone;-webkit-box-decoration-break:clone}em.say::before{content:"🗣 ";font-size:.85em;opacity:.75}strong em.say{font-weight:600}pre .hljs-keyword,pre .hljs-literal{color:#ff7b72}pre .hljs-string{color:#a5d6ff}pre .hljs-title,pre .hljs-title.function_{color:#d2a8ff}pre .hljs-comment{color:#9198a1;font-style:italic}pre .hljs-attr,pre .hljs-attribute,pre .hljs-number{color:#79c0ff}pre .hljs-built_in,pre .hljs-type{color:#ffa657}pre .hljs-name,pre .hljs-tag{color:#7ee787}pre .hljs-meta{color:#79c0ff}pre .hljs-addition,pre .hljs-deletion{display:inline-block;width:100%}pre .hljs-addition{color:#aff5b4;background:rgba(63,185,80,.18);box-shadow:-.8rem 0 0 rgba(63,185,80,.18),.8rem 0 0 rgba(63,185,80,.18)}pre .hljs-deletion{color:#ffc1ba;background:rgba(248,81,73,.18);box-shadow:-.8rem 0 0 rgba(248,81,73,.18),.8rem 0 0 rgba(248,81,73,.18)}'
          checklist () { # $1 md  $2 out  $3 storage-prefix  $4 title
            {
              echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
              echo "<title>$4</title><style>$STYLE</style>"
              echo "</head><body><button onclick=\"Object.keys(localStorage).filter(k=>k.startsWith('$3')).forEach(k=>localStorage.removeItem(k));location.reload()\">Reset checkboxes</button>"
              # marked has no GitHub-alert extension, so `> [!TIP]` survives as literal
              # text in a plain blockquote. Tag the blockquote and let CSS draw the
              # heading — the sheets lean on these to mark the restore steps.
              sed "s|](\.\./|](https://github.com/jgrissom/dotnet-web-dev/blob/main/$wk/|g" "$1" | node "$GITHUB_WORKSPACE/scripts/render-cue-html.js" \
                | perl -0pe 's{<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*}{<blockquote class="alert \L$1\E"><p>}g'
              # Spoken lines — anything the sheet marks as *"…"* — get amber styling and a
              # 🗣 marker, so "say this" separates from "do this" at a glance on the tablet.
              # The source markdown is deliberately untouched: the sheets are read on GitHub
              # too, where a custom marker would be literal text, and tagging here means
              # every week's page picks it up at once with no per-week edit. An <em> whose
              # text opens with a quote is the whole signal — plain italics stay plain.
              echo "<script>document.querySelectorAll('em').forEach(function(e){if(/^[\"“]/.test(e.textContent.trim()))e.classList.add('say');});</script>"
              echo "<script>document.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;const k='$3-'+i;cb.checked=localStorage.getItem(k)==='1';cb.addEventListener('change',()=>localStorage.setItem(k,cb.checked?'1':'0'));});</script>"
              # The whole line toggles its box — the sheet is read off a tablet mid-demo
              # and the box alone is a poor target. Anything interactive inside the line
              # must NOT toggle: links, Copy buttons, code blocks, and <details> (whose
              # triangle is a widget, not text). Nor should finishing a text selection.
              echo "<script>document.querySelectorAll('li').forEach(function(li){var cb=li.querySelector(':scope > input[type=checkbox], :scope > p > input[type=checkbox]');if(!cb)return;li.classList.add('task');li.addEventListener('click',function(e){if(e.target===cb)return;if(e.target.closest('a,button,pre,details'))return;var n=e.target.closest('li');if(n!==li&&n.classList.contains('task'))return;if((getSelection()+'').length)return;cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));});});</script>"
              # Copy button on every code block — you're grabbing these mid-demo.
            # On a ```diff block it copies the RESULT: - lines dropped, the +/space
            # gutter stripped, so the clipboard holds pasteable markup rather than
            # a patch. Without this a diff is read-only, which cost a rehearsal.
            #
            # A diff that ELIDES content (an … line: "…five more articles…") gets NO
            # button at all. Those diffs exist to show where a wrapper lands without
            # reprinting six articles, and a Copy on one would hand over markup that
            # silently drops five of them. The ellipsis is the signal, so the rule
            # enforces itself: elide and you lose the button, no per-week bookkeeping.
              echo "<script>document.querySelectorAll('pre').forEach(function(pre){var d=pre.querySelector('code.language-diff');if(d&&pre.innerText.indexOf(String.fromCharCode(8230))>=0)return;var b=document.createElement('button');b.type='button';b.className='copy';var LBL=d?'Copy result':'Copy';b.textContent=LBL;b.addEventListener('click',function(){var c=pre.querySelector('code');var t=(c||pre).innerText;if(d){var NL=String.fromCharCode(10);t=t.split(NL).filter(function(l){return l.charAt(0)!=='-';}).map(function(l){return l.replace(/^[+ ]/,'');}).join(NL);}navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent=LBL;},1200);},function(){var r=document.createRange();r.selectNodeContents(c||pre);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Press Cmd/Ctrl+C';setTimeout(function(){b.textContent=LBL;},2000);});});pre.appendChild(b);});</script>"
              # Port box: the demo app's port varies by machine, and a wrong port in a
              # pasted curl fails mid-demo. Retype it once here and every localhost URL
              # in the page follows — including what the Copy buttons put on the clipboard.
              echo "<script>(function(){var K='$3-port';var RE=/localhost:[0-9]+/;var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);var nodes=[],n;while(n=w.nextNode()){if(RE.test(n.nodeValue)&&n.parentElement&&n.parentElement.closest('pre,code'))nodes.push(n);}if(!nodes.length)return;var m=nodes[0].nodeValue.match(/localhost:([0-9]+)/);var def=m?m[1]:'5000';function apply(p){nodes.forEach(function(t){t.nodeValue=t.nodeValue.replace(/localhost:[0-9]+/g,'localhost:'+p);});}var bar=document.createElement('span');bar.id='portbar';var lab=document.createElement('label');lab.textContent='Port ';var box=document.createElement('input');box.type='number';box.min='1';box.max='65535';lab.appendChild(box);var hint=document.createElement('small');hint.textContent='every localhost URL below follows this box';bar.appendChild(lab);bar.appendChild(hint);document.body.insertBefore(bar,document.body.firstChild);box.value=localStorage.getItem(K)||def;apply(box.value);box.addEventListener('input',function(){var v=box.value.trim();if(!/^[0-9]{2,5}\$/.test(v))return;localStorage.setItem(K,v);apply(v);});})();</script></body></html>"
            } > "$2"
          }
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>.NET Web Dev — Slide Decks</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3}a{color:#79c0ff;text-decoration:none;font-size:1.2rem}li{margin:.6rem 0}h1{font-size:1.5rem}</style>'
            echo '</head><body><h1>.NET Web Development — Slide Decks</h1><ul>'
            for f in week-*/slides.md; do
              wk="${f%/slides.md}"
              mkdir -p "_site/$wk"
              cp "${f%.md}.html" "_site/$wk/index.html"
              extra=""
              if [ -f "$wk/demo/finished.html" ]; then
                mkdir -p "_site/$wk/demo"
                cp "$wk/demo/finished.html" "_site/$wk/demo/index.html"
                extra=" · <a href=\"$wk/demo/\">demo</a>"
                if [ -f "$wk/demo/index.html" ]; then
                  cp "$wk/demo/index.html" "_site/$wk/demo/before.html"
                  extra="$extra · <a href=\"$wk/demo/before.html\">before</a>"
                fi
              fi
              if [ -f "$wk/demo/demo-script.md" ]; then
                mkdir -p "_site/$wk/demo"
                checklist "$wk/demo/demo-script.md" "_site/$wk/demo/script.html" "$wk-step" "$wk demo script"
                extra="$extra · <a href=\"$wk/demo/script.html\">script</a>"
              fi
              # Projector page: one screen per beat, that beat's diff, and a
              # button that copies the whole file for pasting over the scratch
              # copy. Only weeks with a tagged step branch have one. Rendered to
              # a temp file first so a failure leaves NO page rather than half a
              # page — a half-rendered projector page is worse than none.
              pfx="w$(echo "$wk" | sed 's/week-//')-step-"
              if [ -n "$(git tag --list "${pfx}*")" ]; then
                mkdir -p "_site/$wk/demo"
                if node scripts/render-demo-steps.js "$wk" "$pfx" "$wk/demo/index.html" > /tmp/steps.html; then
                  mv /tmp/steps.html "_site/$wk/demo/steps.html"
                  extra="$extra · <a href=\"$wk/demo/steps.html\">steps</a>"
                else
                  echo "render-demo-steps failed for $wk — no steps page published"
                fi
              fi
              # Student self-check: served so students load it with a one-line
              # fetch+eval from their OWN site's console (Pages sends CORS *).
              if [ -f "$wk/homework-checks.js" ]; then
                cp "$wk/homework-checks.js" "_site/$wk/homework-checks.js"
                extra="$extra · <a href=\"$wk/homework-checks.js\">checker</a>"
              fi
              echo "<li><a href=\"$wk/\">${wk/week-0/Week }</a>$extra</li>"
            done
            echo '</ul><p>Navigate decks with arrow keys · F for fullscreen</p></body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
