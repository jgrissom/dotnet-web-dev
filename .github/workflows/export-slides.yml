name: Export and publish slide decks

on:
  push:
    branches: [main]
    paths:
      - "week-*/slides.md"
      - "week-*/demo/**"
      - "week-*/homework-checks.js"
      - ".github/workflows/export-slides.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export every deck to HTML
        run: |
          for f in week-*/slides.md; do
            npx -y @marp-team/marp-cli "$f" -o "${f%.md}.html"
          done

      - name: Commit regenerated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-*/slides.html
          git diff --cached --quiet || git commit -m "Regenerate slide decks [skip ci]"
          git push

      # Pages site hosts decks, demo pages, and the instructor demo-script checklists —
      # all public-repo material. NEVER answer-key content (solutions, graders).
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          STYLE='body{font-family:system-ui,sans-serif;max-width:46rem;margin:2rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3;line-height:1.6}a{color:#79c0ff}code{background:#151b23;padding:.1rem .35rem;border-radius:4px}pre{background:#151b23;padding:.8rem;border-radius:8px;overflow-x:auto}pre code{background:none;padding:0}li{margin:.35rem 0}input[type=checkbox]{transform:scale(1.3);margin-right:.5rem}li:has(input:checked){opacity:.45;text-decoration:line-through}li>p{display:inline;margin:0}button{padding:.3rem .9rem}blockquote{border-left:3px solid #79c0ff;margin-left:0;padding-left:1rem;color:#a5b4c4}details{margin:.5rem 0}pre{position:relative}pre button.copy{position:absolute;top:.4rem;right:.4rem;padding:.15rem .5rem;font-size:.72rem;line-height:1.4;background:#243040;color:#e6edf3;border:1px solid #3a4a5e;border-radius:5px;cursor:pointer;opacity:.55}pre button.copy:hover,pre:hover button.copy{opacity:1}'
          checklist () { # $1 md  $2 out  $3 storage-prefix  $4 title
            {
              echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'
              echo "<title>$4</title><style>$STYLE</style>"
              echo "</head><body><button onclick=\"Object.keys(localStorage).filter(k=>k.startsWith('$3')).forEach(k=>localStorage.removeItem(k));location.reload()\">Reset checkboxes</button>"
              sed "s|](\.\./|](https://github.com/jgrissom/dotnet-web-dev/blob/main/$wk/|g" "$1" | npx -y marked --gfm
              echo "<script>document.querySelectorAll('input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;const k='$3-'+i;cb.checked=localStorage.getItem(k)==='1';cb.addEventListener('change',()=>localStorage.setItem(k,cb.checked?'1':'0'));});</script>"
              # Copy button on every code block — you're grabbing these mid-demo.
              echo "<script>document.querySelectorAll('pre').forEach(function(pre){var b=document.createElement('button');b.type='button';b.className='copy';b.textContent='Copy';b.addEventListener('click',function(){var c=pre.querySelector('code');var t=(c||pre).innerText;navigator.clipboard.writeText(t).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy';},1200);},function(){var r=document.createRange();r.selectNodeContents(c||pre);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Press Cmd/Ctrl+C';setTimeout(function(){b.textContent='Copy';},2000);});});pre.appendChild(b);});</script></body></html>"
            } > "$2"
          }
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>.NET Web Dev — Slide Decks</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#1c2733;color:#e6edf3}a{color:#79c0ff;text-decoration:none;font-size:1.2rem}li{margin:.6rem 0}h1{font-size:1.5rem}</style>'
            echo '</head><body><h1>.NET Web Development — Slide Decks</h1><ul>'
            for f in week-*/slides.md; do
              wk="${f%/slides.md}"
              mkdir -p "_site/$wk"
              cp "${f%.md}.html" "_site/$wk/index.html"
              extra=""
              if [ -f "$wk/demo/finished.html" ]; then
                mkdir -p "_site/$wk/demo"
                cp "$wk/demo/finished.html" "_site/$wk/demo/index.html"
                extra=" · <a href=\"$wk/demo/\">demo</a>"
                if [ -f "$wk/demo/index.html" ]; then
                  cp "$wk/demo/index.html" "_site/$wk/demo/before.html"
                  extra="$extra · <a href=\"$wk/demo/before.html\">before</a>"
                fi
              fi
              if [ -f "$wk/demo/demo-script.md" ]; then
                mkdir -p "_site/$wk/demo"
                checklist "$wk/demo/demo-script.md" "_site/$wk/demo/script.html" "$wk-step" "$wk demo script"
                extra="$extra · <a href=\"$wk/demo/script.html\">script</a>"
              fi
              # Student self-check: served so students load it with a one-line
              # fetch+eval from their OWN site's console (Pages sends CORS *).
              if [ -f "$wk/homework-checks.js" ]; then
                cp "$wk/homework-checks.js" "_site/$wk/homework-checks.js"
                extra="$extra · <a href=\"$wk/homework-checks.js\">checker</a>"
              fi
              echo "<li><a href=\"$wk/\">${wk/week-0/Week }</a>$extra</li>"
            done
            echo '</ul><p>Navigate decks with arrow keys · F for fullscreen</p></body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
