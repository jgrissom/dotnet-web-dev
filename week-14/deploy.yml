# Week 14: every push to main deploys your app to Azure.
# It goes in your repository at .github/workflows/deploy.yml.
#
# ✏️ Change the one line marked ✏️ to your app's name, and nothing else.
# The credential is NOT in this file: it's the repository secret named below.
#
# It sends your code, not a build of it. Azure builds it, the same way it has
# every time you ran az webapp up — which is why there's no dotnet step here.
name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: your-app-XX1234          # ✏️ your app's name, the one you've used all term
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
